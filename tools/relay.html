<!DOCTYPE html><html><head><meta charset="utf-8"><meta name="robots" content="noindex"><title>LTC ad images</title></head><body>
<p>Pacific Ridgeway internal: hands the two LTC ad images to the parent window (used once to load them into Meta Ads Manager).</p>
<script>
(async () => {
  const files = ['/img/ltc/ltc-ad-costs.png', '/img/ltc/ltc-ad-guide.png'];
  for (const p of files) {
    try {
      const r = await fetch(p, {cache:'no-store'});
      const buf = await r.arrayBuffer();
      parent.postMessage({type:'ltc-image', name:p.split('/').pop(), mime:'image/png', buf}, '*', [buf]);
    } catch (err) {
      parent.postMessage({type:'ltc-error', name:p, error:String(err)}, '*');
    }
  }
  parent.postMessage({type:'ltc-done'}, '*');
})();
</script></body></html>
